<div class="sp-dialog-container">
    <div class="sp-dialog-content p-15">
        <sp-split-section [level]="3" [title]="'Device Identity' | translate">
            <sp-form-field [level]="3" [label]="'Device Name' | translate">
                <mat-form-field class="w-100">
                    <input
                        matInput
                        [(ngModel)]="model.name"
                        [placeholder]="'e.g. PLC Line 1' | translate"
                    />
                </mat-form-field>
            </sp-form-field>
        </sp-split-section>

        <sp-split-section [level]="3" [title]="'Connection' | translate">
            <sp-form-field [level]="3" [label]="'PLC IP Address' | translate">
                <mat-form-field class="w-100">
                    <input
                        matInput
                        [(ngModel)]="model.host"
                        [placeholder]="'e.g. 192.168.0.10' | translate"
                    />
                </mat-form-field>
            </sp-form-field>

            <sp-form-field
                [level]="3"
                [label]="'Polling Interval (ms)' | translate"
            >
                <mat-form-field class="w-100">
                    <input
                        matInput
                        type="number"
                        min="100"
                        [(ngModel)]="model.pollingIntervalMs"
                    />
                </mat-form-field>
            </sp-form-field>
        </sp-split-section>

        @if (errorMessage) {
            <div class="sp-color-warn text-sm mt-sm">
                {{ errorMessage | translate }}
            </div>
        }
    </div>

    <mat-divider></mat-divider>

    <div class="sp-dialog-actions">
        <button
            mat-flat-button
            [disabled]="!isValid || saving"
            (click)="save()"
        >
            {{ (editMode ? 'Save' : 'Add Device') | translate }}
        </button>
        <button mat-flat-button class="mat-basic" (click)="close()">
            {{ 'Cancel' | translate }}
        </button>
    </div>
</div>
