# StreamPipes — deployment compose file
#
# Usage (fresh machine, only Docker required):
#   docker compose -f docker-compose.deploy.yml up -d
#
# Default login:
#   URL:      http://localhost
#   Email:    admin@streampipes.apache.org
#   Password: admin
#
# To update to a new release:
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
#
# ── change IMAGE_ORG and IMAGE_TAG in a .env file or export them before running:
#      IMAGE_ORG=yourorg IMAGE_TAG=latest docker compose -f docker-compose.deploy.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  options:
    max-size: "12m"
    max-file: "5"
  driver: json-file

services:

  backend:
    image: ${IMAGE_ORG:-yourorg}/streampipes-backend:${IMAGE_TAG:-latest}
    environment:
      - SP_PRIORITIZED_PROTOCOL=nats
    depends_on:
      - couchdb
    volumes:
      - backend:/root/.streampipes
    restart: unless-stopped
    logging: *default-logging
    networks:
      spnet:

  ui:
    image: ${IMAGE_ORG:-yourorg}/streampipes-ui:${IMAGE_TAG:-latest}
    environment:
      - SP_HTTP_SERVER_ADAPTER_ENDPOINT=extensions-all-iiot:8090
    ports:
      - "80:8088"
    depends_on:
      - couchdb
      - backend
    volumes:
      - nginx:/etc/nginx/
    restart: unless-stopped
    logging: *default-logging
    networks:
      spnet:

  extensions-all-iiot:
    image: ${IMAGE_ORG:-yourorg}/streampipes-extensions:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks:
      spnet:

  couchdb:
    image: couchdb:3.3.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    volumes:
      - couchdb:/opt/couchdb/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      spnet:

  nats:
    image: nats
    restart: unless-stopped
    networks:
      spnet:

  influxdb:
    image: influxdb:2.6
    environment:
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=sp-admin
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=sp-admin
      - DOCKER_INFLUXDB_INIT_ORG=sp
      - DOCKER_INFLUXDB_INIT_BUCKET=sp
      - DOCKER_INFLUXDB_INIT_MODE=setup
    volumes:
      - influxdb:/var/lib/influxdb
      - influxdb2:/var/lib/influxdb2
    restart: unless-stopped
    logging: *default-logging
    networks:
      spnet:

  mosquitto:
    image: eclipse-mosquitto:1.5.4
    restart: unless-stopped
    logging: *default-logging
    networks:
      spnet:

volumes:
  couchdb:
  influxdb:
  influxdb2:
  backend:
  nginx:

networks:
  spnet:
    name: spnet
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
